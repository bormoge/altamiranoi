[project]
name = "altamiranoi"
version = "0.3.1"  # don't forget to change display_altamiranoi_version and default.nix
description = "A repository collector."
readme = "README.md"
requires-python = ">=3.13"
license = "GPL-3.0-or-later"
license-files = ["LICEN[CS]E*"]
authors = [
  { name = "Geralld Borbón", email = "geralldborbon@gmail.com" },
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: System :: Shells",
  "Topic :: Utilities"
]
dependencies = []

[project.urls]
Changelog = "https://github.com/bormoge/altamiranoi/blob/main/CHANGELOG.md"
Homepage = "https://github.com/bormoge/altamiranoi"
Issues = "https://github.com/bormoge/altamiranoi/issues"
Repository = "https://github.com/bormoge/altamiranoi"
# Documentation = ""

[project.scripts]
altamiranoi = "altamiranoi.altamiranoi_cli:main"

[dependency-groups]
dev = [
  "coverage>=7.13.5",
  "pytest>=9.0.2",
  "rassumfrassum>=0.3.3",
  "twine>=6.2.0",
]

[build-system]
requires = ["hatchling >= 1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
exclude = [
  "*.nix",
  ".dir-locals.el",
  ".dockerignore",
  ".editorconfig",
  ".envrc",
  ".gitignore",
  ".python-version",
  "Dockerfile",
  "default.nix",
  "flake.lock",
  "flake.nix",
  "uv.lock",
]

[tool.hatch.build.targets.wheel]
# only-include = ["src"]
packages = ["src/altamiranoi"]

[tool.uv]
exclude-newer = "2 weeks"
exclude-newer-package = { altamiranoi = false }
